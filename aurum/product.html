<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piece — AURUM</title>
<meta name="description" content="An AURUM piece, exhibited: provenance, materials, and a 360° atelier view.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 30H24.4L16 12.4 7.6 30H2L16 2Z' fill='%23D4AF37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/aurum.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>

<main id="main" class="wrap">
  <div class="product-layout">
    <div class="product-media">
      <div class="media-stage" id="stage"></div>
      <div class="media-tabs" role="tablist" aria-label="Views" id="media-tabs"></div>
    </div>

    <div class="buy-panel">
      <p class="prov" id="p-prov"></p>
      <h1 id="p-name"></h1>
      <p class="lead" id="p-line" style="font-size:var(--step-0)"></p>
      <div class="price-row">
        <span class="price" id="p-price"></span>
        <span class="prov" id="p-rating"></span>
      </div>

      <div class="option-group">
        <span class="lbl" id="cw-label"><span>Colorway</span><span id="cw-name"></span></span>
        <div class="swatch-row" id="cw-row" role="group" aria-labelledby="cw-label"></div>
      </div>

      <div class="option-group">
        <span class="lbl" id="size-label"><span>Size</span><a href="studio.html" style="text-transform:none;letter-spacing:0">Need a custom fit? Visit the Studio</a></span>
        <div class="size-row" id="size-row" role="group" aria-labelledby="size-label"></div>
      </div>

      <div class="buy-actions">
        <button class="btn btn-gold" id="add-btn" type="button">Add to cart</button>
        <button class="btn btn-ghost" id="wish-btn" type="button" aria-pressed="false">Keep in wishlist</button>
      </div>

      <div class="buy-note">
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg> Signature packaging</span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 7.9 7.5 9.5 4.3-1.6 7.5-4.9 7.5-9.5V6L12 3Z"/></svg> Lifetime seam warranty</span>
        <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5C9.4 18.1 8.1 15.3 8.1 12S9.4 5.9 12 3.5Z"/></svg> Worldwide, 2–4 days</span>
      </div>

      <div class="acc" style="margin-top:1.9rem" id="acc"></div>
    </div>
  </div>

  <section class="section-tight" aria-labelledby="rev-h">
    <div class="section-head">
      <div>
        <p class="prov"><span class="n">From the Floor</span></p>
        <h2 id="rev-h" style="font-size:var(--step-3)">Client words</h2>
      </div>
    </div>
    <div id="reviews" style="max-width:46rem"></div>
  </section>

  <section class="section-tight" aria-labelledby="rec-h">
    <div class="section-head">
      <div>
        <p class="prov"><span class="n">Curator's Pairings</span></p>
        <h2 id="rec-h" style="font-size:var(--step-3)">Completes the silhouette</h2>
      </div>
    </div>
    <div class="rail" id="rec-rail" tabindex="0" aria-label="Recommended pieces — scrolls horizontally"></div>
  </section>

  <section class="section-tight" aria-labelledby="seen-h" id="seen-section" hidden>
    <div class="section-head">
      <div>
        <p class="prov"><span class="n">Your Trail</span></p>
        <h2 id="seen-h" style="font-size:var(--step-3)">Recently viewed</h2>
      </div>
    </div>
    <div class="rail" id="seen-rail" tabindex="0" aria-label="Recently viewed pieces — scrolls horizontally"></div>
  </section>
</main>

<footer id="site-footer"></footer>
<script type="module" src="js/product.js"></script>
</body>
</html>
