<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection — AURUM</title>
<meta name="description" content="Enter the AURUM galleries: forty numbered pieces per floor, from merino compression to storm shells.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 30H24.4L16 12.4 7.6 30H2L16 2Z' fill='%23D4AF37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/aurum.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="collection-hero">
    <div class="wrap">
      <p class="prov"><span class="n" id="floor-no">Floor I</span> · The Galleries</p>
      <h1 id="col-title">Men</h1>
      <p class="lead" id="col-lead"></p>
    </div>
  </section>

  <div class="filter-rail" aria-label="Filter and sort">
    <div class="wrap" style="display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center">
      <div id="chips" role="group" aria-label="Filter by category" style="display:flex;flex-wrap:wrap;gap:0.6rem"></div>
      <div class="sort">
        <span class="result-count" id="count" aria-live="polite"></span>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="n">House order</option>
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="name">Name, A–Z</option>
        </select>
      </div>
    </div>
  </div>

  <section class="wrap" aria-label="Products">
    <div class="exhibit-grid" id="grid"></div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="vendor/lenis.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script type="module" src="js/collection.js"></script>
</body>
</html>
