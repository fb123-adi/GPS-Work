# Local production-like stack: Postgres + the app in mock-integration mode.
# Usage:
#   cp .env.example .env    # fill SESSION_SECRET at minimum
#   docker compose up -d db
#   docker compose run --rm migrate
#   docker compose up app
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kyveron
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/kyveron
    command: sh -c "npm ci --no-audit --no-fund && npx tsx scripts/migrate.ts && npx tsx scripts/seed.ts"
    depends_on:
      db: { condition: service_healthy }
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/kyveron
      APP_ENV: ${APP_ENV:-development}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
