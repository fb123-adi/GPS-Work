<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#F2EEE6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#151515;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2EEE6;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;">
        <tr><td style="padding:28px 32px;font-size:20px;font-weight:600;letter-spacing:-0.02em;">KYVERON</td></tr>
        <tr><td style="padding:0 32px 24px;font-size:16px;line-height:1.6;">
          <!-- Campaign content. Every image needs alt text; don't put key information only in images. -->
          {{content}}
        </td></tr>
        <tr><td style="padding:24px 32px;border-top:1px solid #E2DDD3;font-size:12px;line-height:1.6;color:#55524B;">
          You're receiving this because you signed up for Kyveron emails on {{consent_date}}.<br>
          <a href="{{site_url}}/#/unsubscribe?email={{email_urlencoded}}&amp;token={{unsubscribe_token}}" style="color:#214C9A;">Unsubscribe</a>
          &middot; <a href="{{site_url}}/#/privacy" style="color:#214C9A;">Privacy Policy</a><br>
          {{legal_name}}, {{registered_address}}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
