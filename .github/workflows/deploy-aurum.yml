name: Deploy AURUM to Vercel

on:
  push:
    branches:
      - claude/admiring-lamport-o8s5if
    paths:
      - "aurum/**"
      - ".github/workflows/deploy-aurum.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(npx vercel@latest --prod --yes --cwd ./aurum --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 AURUM deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Live URL: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Print deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
