name: Kyveron CI

on:
  push:
    paths: ["kyveron/**", ".github/workflows/kyveron-ci.yml"]
  pull_request:
    paths: ["kyveron/**", ".github/workflows/kyveron-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: kyveron

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kyveron/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
